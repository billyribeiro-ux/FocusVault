services:
  postgres:
    image: postgres:17-alpine
    container_name: focusvault-db
    environment:
      POSTGRES_USER: focusvault
      POSTGRES_PASSWORD: focusvault
      POSTGRES_DB: focusvault
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U focusvault"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: focusvault-app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://focusvault:focusvault@postgres:5432/focusvault
      DB_BACKEND: postgres
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      HOST: 0.0.0.0
      PORT: 3000
      RUST_LOG: info,focusvault=debug
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
