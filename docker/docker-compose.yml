services:
  postgres:
    image: postgres:17-alpine
    container_name: focusvault-db
    environment:
      POSTGRES_USER: focusvault
      POSTGRES_PASSWORD: focusvault
      POSTGRES_DB: focusvault
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U focusvault"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
