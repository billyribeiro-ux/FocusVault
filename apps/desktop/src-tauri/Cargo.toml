[package]
name = "focusvault-desktop"
version = "0.1.0"
edition = "2021"
description = "FocusVault Desktop — local-first execution OS"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Embed the FocusVault server
focusvault-server = { path = "../../../crates/focusvault-server" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
