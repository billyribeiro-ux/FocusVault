[workspace]
resolver = "2"
members = [
    "crates/focusvault-core",
    "crates/focusvault-db-postgres",
    "crates/focusvault-db-sqlite",
    "crates/focusvault-server",
]
# Desktop crate requires GTK/WebKit system libraries; build via `cargo tauri build`
exclude = [
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/billyribeiro-ux/FocusVault"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "uuid", "chrono", "json"] }

# Types
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"

# Error handling
thiserror = "2"
anyhow = "1"

# OpenAPI
utoipa = { version = "5", features = ["uuid", "chrono"] }
utoipa-axum = "0.2"
utoipa-swagger-ui = { version = "9", features = ["axum"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Auth
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
argon2 = "0.5"
rand = "0.10"

# Config
dotenvy = "0.15"

# Testing
tower-service = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["full"] }

# Internal crates
focusvault-core = { path = "crates/focusvault-core" }
focusvault-db-postgres = { path = "crates/focusvault-db-postgres" }
focusvault-db-sqlite = { path = "crates/focusvault-db-sqlite" }
focusvault-server = { path = "crates/focusvault-server" }
